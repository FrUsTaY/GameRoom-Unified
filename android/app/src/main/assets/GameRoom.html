<script>
    (function() {
        const fill = document.getElementById('progress-fill');
        const textContainer = document.getElementById('progress-text-container');
        const startTime = Date.now();
        const MIN_DURATION = 4500;
        let finishCalled = false;

        // 1. Генерируем колонку цифр 0-100 для "барабана" ДО начала сильной нагрузки
        let nums = '';
        for(let i = 0; i <= 100; i++) {
            nums += i + '%<br>';
        }
        textContainer.innerHTML = nums;

        // 2. Запускаем анимации строго на видеокарте (GPU)
        fill.className = 'animate-bar';
        textContainer.className = 'animate-text-scroll';

        window.finishLoading = function() {
            if (finishCalled) return;
            finishCalled = true;

            const elapsed = Date.now() - startTime;
            const remainingTime = Math.max(0, MIN_DURATION - elapsed);

            setTimeout(() => {
                // Плавно доводим до 100% (смещение 100 * 24px = 2400px)
                fill.style.animation = 'none';
                fill.style.transition = 'transform 0.3s ease';
                fill.style.transform = 'scaleX(1)';

                textContainer.style.animation = 'none';
                textContainer.style.transition = 'transform 0.3s ease';
                textContainer.style.transform = 'translateY(-2400px)';

                setTimeout(() => {
                    const screen = document.getElementById('loading-screen');
                    if(screen) {
                        screen.style.opacity = '0';
                        setTimeout(() => screen.remove(), 600);
                    }
                }, 300);
            }, remainingTime);
        };
    })();
</script>

// === РЕЖИМ РАБОТЫ: онлайн (Replit, бэкенд-прокси) или офлайн (APK/file://, ключи в localStorage) ===
const IS_ONLINE = false;

const API_BASE = (() => {
if (!IS_ONLINE) return '';
const h = window.location.hostname || '';
if (h === 'localhost' || h === '127.0.0.1') {
    return 'http://localhost:3000/api'; // порт вашего API-сервера
}
return '/api'; // для Replit
})();

// Подключение функций из api.js
// apiFetch использует модуль api.js для автоматической работы в ONLINE/OFFLINE/PARTIAL режимах
// API вызовы автоматически кэшируются и используют localStorage при отсутствии интернета

// imgSrc: в онлайне переписывает CORS-проблемные картинки media.rawg.io на наш прокси
const imgSrc = (url) => {
if (!url) return url;
if (/^https?:\/\/media\.rawg\.io\//.test(url)) {
return `https://wsrv.nl/?url=${encodeURIComponent(url)}`;
}
return url;
};

// === УМНЫЙ API ФЕТЧ (автоматически выбирает режим работы) ===
// Если API ключи есть и интернет доступен - работает в ONLINE режиме
// Если нет интернета - использует кэш из localStorage
// Если частично доступен - использует кэш + пытается обновить

const apiFetch = async (target, options = {}) => {
const mode = detectMode();

// Читаем ключи из localStorage напрямую
const rawgKey = localStorage.getItem('rawg_api_key') || '';
const gigachatKey = localStorage.getItem('gigachat_auth_key') || '';
const youtubeKey = localStorage.getItem('youtube_api_key') || '';
const yandexKey = localStorage.getItem('yandex_oauth_token') || '';

switch (target.kind) {
    case 'rawg-games':
        const search = target.query?.search || target.search || '';
        if (!rawgKey && mode === API_MODES.OFFLINE) {
            // Если ключа нет и офлайн - возвращаем пустой результат
            return { results: [], error: 'NO_KEY_OFFLINE' };
        }
        // Используем прямой вызов (функция из api.js будет автоматически кэшировать)
        return await fetchRAWG(search, rawgKey);

    case 'gigachat-chat':
        if (!gigachatKey && mode === API_MODES.OFFLINE) {
            return { error: 'NO_KEY_OFFLINE' };
        }
        // Получаем токен и экспирацию из localStorage (если есть)
        const savedToken = localStorage.getItem('gigachat_token');
        const savedExpiry = localStorage.getItem('gigachat_token_expiry');
        return await fetchGigaChat(target.body?.messages || [], gigachatKey, savedToken || null, savedExpiry ? parseInt(savedExpiry) : null);

    case 'gemini-chat':
        const geminiKey = localStorage.getItem('gemini_api_key') || '';
        if (!geminiKey && mode === API_MODES.OFFLINE) {
            return { error: 'NO_KEY_OFFLINE' };
        }
        return await fetchGemini(target.body || {}, geminiKey);

    case 'youtube-search':
        if (!youtubeKey && mode === API_MODES.OFFLINE) {
            return { error: 'NO_KEY_OFFLINE' };
        }
        return await fetchYouTube(target.query || '', youtubeKey);

    default:
        throw new Error('Неизвестный тип запроса apiFetch: ' + target.kind);
}
};

// === ОПТИМИЗИРОВАННЫЙ ICON (React.memo + меньше эффектов) ===
const Icon = React.memo(({ name, size = 20, className = "" }) => {
const containerRef = React.useRef(null);

React.useEffect(() => {
    if (!containerRef.current) return;
    const container = containerRef.current;
    container.innerHTML = '';

    const iconElement = document.createElement('i');
    iconElement.setAttribute('data-lucide', name);
    if (className) iconElement.className = className;
    iconElement.style.width = `${size}px`;
    iconElement.style.height = `${size}px`;

    container.appendChild(iconElement);

if (typeof lucide !== 'undefined') {
if (typeof lucide.replaceElement === 'function') {
    lucide.replaceElement(iconElement);
} else if (typeof lucide.createIcons === 'function') {
    lucide.createIcons({ elements: [iconElement] });
}
}

    return () => {
        container.innerHTML = '';
    };
}, [name, size, className]);

return <span ref={containerRef} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} />;
});

class BaseKeeperAgent {
async chat(prompt, systemInstruction) {
    throw new Error("Method 'chat()' must be implemented.");
}
}

class GigaChatAgent extends BaseKeeperAgent {
constructor(authKey) {
    super();
    this.authKey = authKey;
}

async chat(prompt, systemInstruction) {
    if (!IS_ONLINE && !this.authKey) {
        alert('Сначала введите ключ авторизации GigaChat в настройках!');
        return 'Ошибка: отсутствует ключ авторизации GigaChat.';
    }

    try {
        const messages = [
            { role: 'system', content: systemInstruction },
            { role: 'user', content: prompt }
        ];
        const requestBody = {
            model: 'GigaChat',
            messages: messages,
            temperature: 0.7
        };

        // Вспомогательная функция для запроса к API
        const doRequest = async (token) => {
            return await fetch('https://gigachat.devices.sberbank.ru/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(requestBody)
            });
        };

        let currentToken = localStorage.getItem('gigachat_token');
        let currentExpiry = localStorage.getItem('gigachat_token_expiry');

        // Проверка: получаем токен, если его нет или он просрочен
        if (!currentToken || !currentExpiry || Date.now() >= parseInt(currentExpiry) - 60000) {
            const { token, expiresAt } = await getGigaChatToken(this.authKey);
            localStorage.setItem('gigachat_token', token);
            localStorage.setItem('gigachat_token_expiry', expiresAt.toString());
            currentToken = token;
        }

        let response = await doRequest(currentToken);

        // Если токен просрочен (401), пробуем обновить один раз
        if (response.status === 401) {
            console.log('Токен просрочен, запрашиваю новый...');
            const { token, expiresAt } = await getGigaChatToken(this.authKey);
            localStorage.setItem('gigachat_token', token);
            localStorage.setItem('gigachat_token_expiry', expiresAt.toString());
            response = await doRequest(token);
        }

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(`Ошибка GigaChat: ${errorData.message || response.statusText}`);
        }

        const data = await response.json();
        return data.choices[0]?.message?.content || 'Хранитель не нашёл слов.';

    } catch (error) {
        console.error('Ошибка GigaChat:', error);
        return `Ошибка: ${error.message}`;
    }
}
}

class GeminiAgent extends BaseKeeperAgent {
constructor(apiKey) {
    super();
    this.apiKey = apiKey;
}

async chat(prompt, systemInstruction) {
    if (!IS_ONLINE && !this.apiKey) {
        alert('Сначала введите ключ авторизации Gemini в настройках!');
        return 'Ошибка: отсутствует ключ авторизации Gemini.';
    }

    try {
        const requestBody = {
            contents: [{
                parts: [{ text: `${systemInstruction}\n\n${prompt}` }]
            }],
            generationConfig: {
                temperature: 0.7
            }
        };

        let response;
        if (IS_ONLINE) {
            response = await apiFetch({ kind: 'gemini-chat', body: requestBody });
        } else {
            response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${this.apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestBody)
            });
        }

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(`Ошибка Gemini: ${errorData.error?.message || response.statusText}`);
        }

        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || 'Хранитель не нашёл слов.';

    } catch (error) {
         console.error('Ошибка Gemini:', error);
         let userMessage = error.message;
         if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
             userMessage = 'Не удалось подключиться к Gemini. Проверьте интернет-соединение.';
         }
         return `Ошибка: ${userMessage}`;
    }
}
}

class KeeperAgentFactory {
static getAgent(provider, config) {
    if (provider === 'Gemini') {
        return new GeminiAgent(config.geminiApiKey);
    }
    return new GigaChatAgent(config.gigachatAuthKey);
}
}

const getGigaChatToken = async (authKey) => {
if (!authKey) {
    throw new Error('Не указан ключ авторизации GigaChat');
}

// Check if the provided key is a UUID (Client Secret format)
// If it is, format it with Client ID and encode to Base64
let finalAuthKey = authKey;
const isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(authKey);
if (isUUID) {
    const clientId = '019d9b23-6f39-7aa5-aedd-7f181974f3f9';
    finalAuthKey = btoa(`${clientId}:${authKey}`);
}

const url = 'https://ngw.devices.sberbank.ru:9443/api/v2/oauth';
const response = await fetch(url, {
    method: 'POST',
    headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'Accept': 'application/json',
        'RqUID': crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
        'Authorization': `Basic ${finalAuthKey}`
    },
    body: 'scope=GIGACHAT_API_PERS'
});

if (!response.ok) {
    const errorText = await response.text();
    throw new Error(`Ошибка получения токена: ${response.status} ${errorText || 'Неизвестная ошибка'}`);
}

const data = await response.json();
return {
    token: data.access_token,
    expiresAt: Date.now() + (data.expires_in * 1000)
};
};

    };
    if (cfClearance) {
        headers['Cookie'] = `cf_clearance=${cfClearance}`;
    }
    const response = await fetch(url, {
        method: 'POST',
        headers,
        body
    });
    if (!response.ok) {
        if (response.status === 403) {
            showMessage('error', 'Кука cf_clearance устарела. Обновите её в настройках.');
        }
        return null;
    }
    const data = await response.json();
    if (data.data && data.data.length > 0) {
        const game = data.data[0];
        return {
            mainStory: game.gameplayMain > 0 ? game.gameplayMain : null,
            completionist: game.gameplayCompletionist > 0 ? game.gameplayCompletionist : null
        };
    }
} catch (error) {
    console.error('HLTB fetch error:', error);
}
return null;
};

const extractGameName = (text) => {
if (!text) return null;

// Функция для очистки названия от лишних символов
const cleanName = (name) => {
return name
  .replace(/^[*"«'\-—\s]+|[*"»'\-—\s]+$/g, '')  // удаление кавычек, тире, пробелов по краям
  .replace(/\*/g, '')                              // удаление всех звёздочек
  .replace(/\s*\(?от\s+.*$/i, '')                  // удаление "от студии ..."
  .replace(/\s*\(?студия\s+.*$/i, '')              // удаление "студия ..."
  .replace(/[\(\)]/g, '')                          // удаление скобок
  .trim();
};

const советуетMatch = text.match(/(?:Советую|Рекомендую|Посоветую)[:\s]+([^.!?\n]+?)(?:[.!?\n]|$)/i);
if (советуетMatch) return cleanName(советуетMatch[1]);

const quoteMatch = text.match(/[«"]([^»"]+)[»"]/);
if (quoteMatch) return cleanName(quoteMatch[1]);

const sentenceMatch = text.match(/^[^.!?\n]+/);
if (sentenceMatch) return cleanName(sentenceMatch[0]);

return null;
};

  if (!response.ok) throw new Error('Failed to fetch trailer');
  const data = await response.json();
  videoId = data.videoId;

        const stats = useMemo(() => {
let hours = totalHours;

    cumulative += xpToNext;
    level++;
    if (level >= 20) xpToNext = 20;
    else if (level >= 10) xpToNext = 15;
    else xpToNext = 10;
}

const currentXp = hours - cumulative;
const progressPercent = Math.min(100, (currentXp / xpToNext) * 100);
const nextLevelValue = (xpToNext - currentXp).toFixed(1);

let rank = level >= 50 ? "ЛЕГЕНДА" : level >= 20 ? "МАСТЕР" : level >= 5 ? "ИГРОК" : "НОВИЧОК";

// Расчет прогресса до следующего ранга
let nextRank = null;
let hoursToNextRank = 0;
if (level < 5) {
    nextRank = "ИГРОК";
    hoursToNextRank = 40 - hours; // 5 уровней по 10 XP
} else if (level < 20) {

const performUpload = async () => {
if (!isMountedRef.current) return;
setIsSyncing(true);
if (isMountedRef.current) {
    showMessage('info', 'Начинаем загрузку на Яндекс.Диск...');
}

try {
const appData = {
games: games,
wishlist: wishlist,
playedList: playedList,
aiMessage: aiMessage,
recommendMessage: recommendMessage,
showAiAnswer: showAiAnswer,
showRecommendAnswer: showRecommendAnswer,
yearSummary: yearSummary,
monthSummary: monthSummary,
exportDate: new Date().toISOString(),
version: '2.0'
};
    const fileContent = JSON.stringify(appData, null, 2);
    const file = new Blob([fileContent], { type: 'application/json' });

    const uploadPath = `app:/${BACKUP_FILENAME}`;

    if (!isMountedRef.current) return;
    showMessage('info', 'Загружаем файл с данными...');

    let uploadResponse;
    if (IS_ONLINE) {
        // Онлайн: отдаём файл нашему серверу, он сам всё делает
        uploadResponse = await fetch(`${API_BASE}/yandex/disk/upload?path=${encodeURIComponent(uploadPath)}`, {
            method: 'PUT',
            body: file,
            headers: { 'Content-Type': 'application/json' }
        });
    } else {
        // Офлайн (APK): двухэтапный процесс через прямые запросы
        const getUploadUrl = `https://cloud-api.yandex.net/v1/disk/resources/upload?path=${encodeURIComponent(uploadPath)}&overwrite=true`;
        const uploadUrlResponse = await fetch(getUploadUrl, {
            method: 'GET',
            headers: { 'Authorization': `OAuth ${yandexToken}`, 'Content-Type': 'application/json' }
        });
        if (!uploadUrlResponse.ok) {
            const errorData = await uploadUrlResponse.json();
            throw new Error(`Ошибка получения ссылки: ${errorData.message || uploadUrlResponse.statusText}`);
        }
        const uploadUrlData = await uploadUrlResponse.json();
        uploadResponse = await fetch(uploadUrlData.href, {
            method: 'PUT',
            body: file,
            headers: { 'Content-Type': 'application/json' }
        });
    }
    if (!uploadResponse.ok) {
        let msg = uploadResponse.statusText;
        try { const e = await uploadResponse.json(); msg = e.error || e.message || msg; } catch {}
        throw new Error(`Ошибка загрузки файла: ${msg}`);
    }

    if (isMountedRef.current) {
        showMessage('success', '✅ Данные успешно сохранены на Яндекс.Диск!');
    }
} catch (error) {
    console.error('Ошибка синхронизации с Яндекс.Диском:', error);
    if (isMountedRef.current) {
        setSyncMessage({ type: 'error', text: `❌ Ошибка: ${error.message}` });
    }
} finally {
    if (isMountedRef.current) {
        setIsSyncing(false);
        // Таймер для автоочистки теперь управляется внутри showMessage
    }
}
};

        }
        const downloadUrlData = await downloadUrlResponse.json();

        }
        fileContent = await fileResponse.text();

if (appData.games && Array.isArray(appData.games) && appData.wishlist && Array.isArray(appData.wishlist)) {

    if (appData.yearSummary !== undefined) setYearSummary(appData.yearSummary);

}

        const file = e.target.files?.[0];

        try {
            const text = await file.text();
            const data = JSON.parse(text);
            if (!Array.isArray(data)) throw new Error('Массив ожидался');
            let updated = 0;
            setWishlist(prev => prev.map(g => {
                const found = data.find(entry => entry.title?.toLowerCase() === g.title.toLowerCase());

                    updated++;
                    return { ...g, avgPlaytime: parseFloat(found.time) };
                }
                return g;
            }));
            showMessage('success', `Время обновлено для ${updated} игр.`);
        } catch (err) {
            showMessage('error', 'Ошибка чтения файла. Проверьте формат JSON.');

onClick={() => {
  if (recommendAdded) return;
  let gameName = null;
  const советуетMatch = recommendMessage.match(/(?:Советую|Рекомендую|Посоветую)[:\s]+([^.!?\n]+?)(?:[.!?\n]|$)/i);
  if (советуетMatch) gameName = советуетMatch[1].trim();
  if (!gameName) {
    const quoteMatch = recommendMessage.match(/[«"]([^»"]+)[»"]/);
    if (quoteMatch) gameName = quoteMatch[1].trim();
  }
  if (!gameName) {
    const sentenceMatch = recommendMessage.match(/^[^.!?\n]+/);
    if (sentenceMatch) gameName = sentenceMatch[0].trim();
  }
  if (gameName) {
    gameName = gameName.replace(/^[*"«'\-—\s]+|[*"»'\-—\s]+$/g, '').trim();
    gameName = gameName.replace(/\s*\(?от\s+.*$/i, '').replace(/\s*\(?студия\s+.*$/i, '').trim();
    gameName = gameName.replace(/[\(\)]/g, '').trim();
  }
  if (gameName) {
    const normalized = gameName.toLowerCase().replace(/[^\w\s]/g, '').trim();
    const alreadyExists = playedList.some(item =>
      item.toLowerCase().replace(/[^\w\s]/g, '').trim() === normalized
    );
    if (!alreadyExists) {
      setPlayedList([...playedList, gameName]);
    }
    setRecommendAdded(true);
    showMessage('success', `✅ Игра "${gameName}" добавлена в список пройденного.`);
  } else {
    showMessage('error', '❌ Не удалось определить название игры.');

                                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                            <polyline points="7 10 12 15 17 10" />
                                            <line x1="12" y1="15" x2="12" y2="3" />
                                        </svg>
                                    )}
                                </div>
                                <h3 className="text-lg font-black text-cyan-300">
                                    {confirmDialog.type === 'upload' ? 'Сохранение на Диск' : 'Загрузка с Диска'}
                                </h3>
                            </div>
                            <p className="text-sm text-slate-300 mb-6">
                                {confirmDialog.type === 'upload'
                                    ? 'Сохранить текущие данные в облако? Файл будет перезаписан.'
                                    : 'Внимание! Все локальные данные будут заменены данными из облака. Продолжить?'}
                            </p>
                            <div className="flex gap-3">
                                <button
                                    onClick={handleCancel}
                                    className="flex-1 py-3 glass text-slate-400 rounded-2xl font-bold"
                                >
                                    Отмена
                                </button>
                                <button
                                    onClick={handleConfirm}
                                    className="flex-1 py-3 bg-gradient-to-r from-cyan-400 to-purple-400 text-black font-black rounded-2xl"
                                >
                                    {confirmDialog.type === 'upload' ? 'Сохранить' : 'Загрузить'}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {/* Delete Dialog */}
                {deleteDialog.show && (
                    <div className="fixed inset-0 z-[150] flex items-center justify-center p-6 bg-black/95 backdrop-blur-xl">
                        <div className="glass w-full max-w-sm rounded-3xl p-6">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 rounded-full bg-red-400/20 flex items-center justify-center">
                                    <Icon name="trash-2" size={22} className="text-red-400" />
                                </div>
                                <h3 className="text-lg font-black text-red-300">Удаление игры</h3>
                            </div>
                            <p className="text-sm text-slate-300 mb-6">
                                {deleteDialog.isWishlist
                                    ? 'Удалить игру из списка «Хочу пройти»?'
                                    : 'Удалить игру из библиотеки?'}
                            </p>
                            <div className="flex gap-3">
                                <button
                                    onClick={handleDeleteCancel}
                                    className="flex-1 py-3 glass text-slate-400 rounded-2xl font-bold"
                                >
                                    Отмена
                                </button>
                                <button
                                    onClick={handleDeleteConfirm}
                                    className="flex-1 py-3 bg-gradient-to-r from-red-400 to-red-600 text-black font-black rounded-2xl"
                                >
                                    Удалить
                                </button>
                            </div>
                        </div>
                    </div>
                )}
                                    {/* Clear PlayedList Dialog */}
                {clearPlayedListDialog && (
                    <div className="fixed inset-0 z-[150] flex items-center justify-center p-6 bg-black/95 backdrop-blur-xl">
                        <div className="glass w-full max-w-sm rounded-3xl p-6">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 rounded-full bg-red-400/20 flex items-center justify-center">
                                    <Icon name="alert-triangle" size={22} className="text-red-400" />
                                </div>
                                <h3 className="text-lg font-black text-red-300">Очистка списка</h3>
                            </div>
                            <p className="text-sm text-slate-300 mb-6">
                                Вы уверены, что хотите очистить весь список «Уже играл»? Это действие нельзя отменить.
                            </p>
                            <div className="flex gap-3">
                                <button
                                    onClick={() => setClearPlayedListDialog(false)}
                                    className="flex-1 py-3 glass text-slate-400 rounded-2xl font-bold"
                                >
                                    Отмена
                                </button>
                                <button
                                    onClick={() => {
                                        setPlayedList([]);
                                        setClearPlayedListDialog(false);
                                        showMessage('success', '✅ Список «Уже играл» очищен.');
                                    }}
                                    className="flex-1 py-3 bg-gradient-to-r from-red-400 to-red-600 text-black font-black rounded-2xl"
                                >
                                    Очистить
                                </button>
                            </div>
                        </div>
                    </div>
                )}
                                    {/* Move to Games Dialog */}
                {moveToGamesDialog.show && (
                    <div className="fixed inset-0 z-[150] flex items-center justify-center p-6 bg-black/95 backdrop-blur-xl">
                        <div className="glass w-full max-w-sm rounded-3xl p-6">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 rounded-full bg-green-400/20 flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4ade80" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                        <polygon points="5 3 19 12 5 21 5 3"/>
                                    </svg>
                                </div>
                                <h3 className="text-lg font-black text-green-300">Перенос в Игровую комнату</h3>
                            </div>
                            <p className="text-sm text-slate-300 mb-6">
                                Игра <span className="text-cyan-300 font-bold">{moveToGamesDialog.game?.title}</span> будет добавлена в библиотеку со статусом <span className="text-blue-300">«В процессе»</span>. Продолжить?
                            </p>
                            <div className="flex gap-3">
                                <button
                                    onClick={() => setMoveToGamesDialog({ show: false, game: null })}
                                    className="flex-1 py-3 glass text-slate-400 rounded-2xl font-bold"
                                >
                                    Отмена
                                </button>
                                <button
                                    onClick={() => {
                                        moveGameFromWishlistToGames(moveToGamesDialog.game);
                                        setMoveToGamesDialog({ show: false, game: null });
                                        showMessage('success', `✅ Игра «${moveToGamesDialog.game.title}» перенесена в Игровую комнату (В процессе).`);
                                    }}
                                    className="flex-1 py-3 bg-gradient-to-r from-green-400 to-cyan-400 text-black font-black rounded-2xl"
                                >
                                    Перенести
                                </button>
                            </div>
                        </div>
                    </div>
                )}
                {trailerModal.isOpen && (
                  <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl" onClick={() => setTrailerModal({ isOpen: false, videoId: null })}>
                    <div className="relative w-full max-w-3xl" onClick={e => e.stopPropagation()}>
                      <button
                        className="absolute -top-10 right-0 text-white/70 hover:text-white"
                        onClick={() => setTrailerModal({ isOpen: false, videoId: null })}
                      >
                        <Icon name="x" size={28} />
                      </button>
                      <div className="relative pt-[56.25%] rounded-2xl overflow-hidden glass">
                        <iframe
                          className="absolute top-0 left-0 w-full h-full"
                          src={`https://www.youtube-nocookie.com/embed/${trailerModal.videoId}?autoplay=1&enablejsapi=1`}
                          title="YouTube video player"
                          frameBorder="0"
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                          allowFullScreen
                        />
                      </div>
                    </div>
                  </div>
                )}
                                    {/* Add to Wishlist Confirmation Dialog */}
                {addToWishlistDialog.show && (
                  <div className="fixed inset-0 z-[150] flex items-center justify-center p-6 bg-black/95 backdrop-blur-xl">
                    <div className="glass w-full max-w-sm rounded-3xl p-6">
                      <div className="flex items-center gap-3 mb-4">
                        <div className="w-10 h-10 rounded-full bg-green-400/20 flex items-center justify-center">
                          <Icon name="target" size={22} className="text-green-400" />
                        </div>
                        <h3 className="text-lg font-black text-green-300">Добавить в список желаемого?</h3>
                      </div>
                      <p className="text-sm text-slate-300 mb-6">
                        Игра <span className="text-cyan-300 font-bold">{addToWishlistDialog.gameData?.title}</span> будет добавлена в раздел «Хочу пройти».
                      </p>
                      <div className="flex gap-3">
<button
onClick={() => {
    if (addToWishlistDialog.gameId) {
        setWishlistAdded(prev => ({ ...prev, [addToWishlistDialog.gameId]: false }));
    } else {
        setWishlistAdded(prev => ({ ...prev, global: false }));
    }
    setAddToWishlistDialog({ show: false, gameData: null, gameId: null });
}}
className="flex-1 py-3 glass text-slate-400 rounded-2xl font-bold"
>
Отмена
</button>
                        <button
                          onClick={() => {
                            if (addToWishlistDialog.gameData) {
                              const newGame = {
                                ...addToWishlistDialog.gameData,
                                id: Date.now().toString()
                              };
                              setWishlist([...wishlist, newGame]);
                              showMessage('success', `✅ Игра "${newGame.title}" добавлена в список желаемого.`);
                            }
                            setAddToWishlistDialog({ show: false, gameData: null, gameId: null });
                          }}
                          className="flex-1 py-3 bg-gradient-to-r from-green-400 to-cyan-400 text-black font-black rounded-2xl"
                        >
                          Добавить
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* Delete PlayedList Item Dialog */}
                {deletePlayedDialog.show && (
                  <div className="fixed inset-0 z-[150] flex items-center justify-center p-6 bg-black/95 backdrop-blur-xl">
                    <div className="glass w-full max-w-sm rounded-3xl p-6">
                      <div className="flex items-center gap-3 mb-4">
                        <div className="w-10 h-10 rounded-full bg-red-400/20 flex items-center justify-center">
                          <Icon name="trash-2" size={22} className="text-red-400" />
                        </div>
                        <h3 className="text-lg font-black text-red-300">Удаление из списка</h3>
                      </div>
                      <p className="text-sm text-slate-300 mb-6">
                        Удалить игру «<span className="text-cyan-300 font-bold">{deletePlayedDialog.gameName}</span>» из списка «Уже играл»?
                      </p>
                      <div className="flex gap-3">
                        <button
                          onClick={() => setDeletePlayedDialog({ show: false, gameName: null })}
                          className="flex-1 py-3 glass text-slate-400 rounded-2xl font-bold"
                        >
                          Отмена
                        </button>
                        <button
                          onClick={() => {
                            setPlayedList(playedList.filter(item => item !== deletePlayedDialog.gameName));
                            setDeletePlayedDialog({ show: false, gameName: null });
                            showMessage('success', `✅ Игра «${deletePlayedDialog.gameName}» удалена из списка.`);
                          }}
                          className="flex-1 py-3 bg-gradient-to-r from-red-400 to-red-600 text-black font-black rounded-2xl"
                        >
                          Удалить
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* Fate Modal — Голос Судьбы */}
                {fateModalOpen && (
<div className="fixed inset-0 z-[200] flex items-center justify-center p-6 bg-black/80 backdrop-blur-md" onClick={() => { if (!fateSpinning) { resetFateStates(); setFateModalOpen(false); } }}>
    <div className="glass w-full max-w-sm rounded-3xl p-6" onClick={e => e.stopPropagation()}>
        {!fateSpinning && !fateResult && (
            <>
                <div className="flex justify-between items-center mb-4">
                    <h2 className="text-lg font-black text-purple-300 title-font">ГОЛОС СУДЬБЫ</h2>
                    <button onClick={() => { resetFateStates(); setFateModalOpen(false); }} className="text-slate-400 hover:text-white">
                        <Icon name="x" size={22} />
                    </button>
                </div>
                <p className="text-xs text-slate-400 mb-4">Выбери платформу, и судьба решит, во что ты будешь играть.</p>

                <div className="flex items-center gap-2 mb-3">
                    <input
                        type="checkbox"
                        id="fateShortCheck"
                        checked={fateShortOnly}
                        onChange={e => setFateShortOnly(e.target.checked)}
                        className="w-4 h-4 rounded accent-purple-500"
                    />
                    <label htmlFor="fateShortCheck" className="text-xs text-slate-400 cursor-pointer">Только короткие (≤10 ч)</label>
                </div>

                <div onClick={() => startFateRoulette('PC')} className="flex items-center gap-3 p-4 mb-3 rounded-2xl bg-cyan-500/10 border border-cyan-400/40 hover:bg-cyan-500/20 transition-colors cursor-pointer">
                    <div className="w-10 h-10 rounded-xl bg-cyan-400/20 flex items-center justify-center">
                        <Icon name="monitor" size={22} className="text-cyan-400" />
                    </div>
                    <div className="flex-1 font-bold text-cyan-300">Домашний ПК</div>
                    <div className="text-xs font-black text-cyan-400/70">{wishlist.filter(g => g.platform === 'Домашний ПК' || g.platform === 'Рабочий ПК').length}</div>
                </div>

                <div onClick={() => startFateRoulette('Switch')} className="flex items-center gap-3 p-4 mb-3 rounded-2xl bg-red-500/10 border border-red-400/40 hover:bg-red-500/20 transition-colors cursor-pointer">
                    <div className="w-10 h-10 rounded-xl bg-red-400/20 flex items-center justify-center">
                        <Icon name="gamepad-2" size={22} className="text-red-400" />
                    </div>
                    <div className="flex-1 font-bold text-red-300">Nintendo Switch</div>
                    <div className="text-xs font-black text-red-400/70">{wishlist.filter(g => g.platform === 'Nintendo Switch').length}</div>
                </div>

                <div onClick={() => startFateRoulette('Quest')} className="flex items-center gap-3 p-4 mb-1 rounded-2xl bg-white/10 border border-white/30 hover:bg-white/20 transition-colors cursor-pointer">
                    <div className="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center">
                        <Icon name="glasses" size={22} className="text-white" />
                    </div>
                    <div className="flex-1 font-bold text-white">Oculus Quest 3s</div>
                    <div className="text-xs font-black text-white/70">{wishlist.filter(g => g.platform === 'Oculus Quest 3s').length}</div>
                </div>
            </>
        )}

        {fateSpinning && !fateResult && (
            <div className="flex flex-col items-center py-6">
                <p className="text-xs text-purple-300 mb-2">Судьба выбирает...</p>
                <div className="text-xl font-black text-center text-cyan-300 mb-4 h-8 overflow-hidden">
                    {fateGamesCache.current[fateSpinIndex]?.title || ''}
                </div>
                <div className="h-1 w-full bg-purple-400/20 rounded-full overflow-hidden">
                    <div className="h-full bg-purple-400 animate-pulse rounded-full" style={{ width: '100%' }} />
                </div>
            </div>
        )}

        {fateResult && (
            <div className="flex flex-col items-center py-4">
                <div className="flex justify-between items-center w-full mb-1">
                    <h2 className="text-sm font-black text-purple-300 title-font">ВЫБОР СДЕЛАН</h2>
                    <button onClick={() => { resetFateStates(); setFateModalOpen(false); }} className="text-slate-400 hover:text-white">
                        <Icon name="x" size={22} />
                    </button>
                </div>
                <div className="text-2xl font-black text-cyan-300 text-center mb-4">{fateResult.title}</div>
                {fateCover && (
                    <img src={imgSrc(fateCover)} alt="" className="w-40 h-24 rounded-xl object-cover border border-white/10 mb-4" />
                )}
                <p className="text-xs italic text-slate-400 text-center mb-6">«{getRandomFatePhrase()}»</p>
                <div className="flex gap-3 w-full items-stretch">
                    <button
                        onClick={() => {
                            moveGameFromWishlistToGames(fateResult);
                            setFateModalOpen(false);
                            showMessage('success', `✅ «${fateResult.title}» перенесена в Игровую комнату.`);
                        }}
                        className="flex-1 py-3 bg-gradient-to-r from-cyan-400 to-purple-400 text-black font-black rounded-2xl"
                    >
                        Начать прохождение
                    </button>
                    <div className="flex gap-1">
                        <button
                            onClick={() => fetchTrailer(fateResult.title)}
                            className="px-3 py-3 bg-purple-400/20 border border-purple-400/50 rounded-2xl text-purple-300 font-bold text-xs flex items-center gap-1 hover:bg-purple-400/30 transition-colors"
                        >
                            <Icon name="play" size={14} />
                            Трейлер
                        </button>
                        <button
                            onClick={() => {
                                setFateResult(null);
                                startFateRoulette(fateChosenPlatform);
                            }}
                            className="px-3 py-3 glass text-slate-400 rounded-2xl font-bold text-xs"
                        >
                            Перебросить
                        </button>
                    </div>
                </div>
            </div>
        )}
    </div>
</div>
)}

                {/* Стилизованный диалог подтверждения выхода */}
                {exitConfirmationOpen && (
                    <div className="fixed inset-0 z-[150] flex items-center justify-center p-6 bg-black/90 backdrop-blur-xl">
                        <div className="glass w-full max-w-md rounded-3xl p-8">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-black italic text-red-300 title-font">
                                    ВЫХОД
                                </h2>
                                <button
                                    onClick={() => setExitConfirmationOpen(false)}
                                    className="text-slate-400 hover:text-white transition-colors"
                                    title="Закрыть"
                                    aria-label="Закрыть окно"
                                >
                                    <Icon name="x" size={28}/>
                                    <span className="sr-only">Закрыть</span>
                                </button>
                            </div>

                            <p className="text-slate-300 mb-8">
                                Вы уверены, что хотите выйти из приложения?
                            </p>

                            <div className="flex gap-3">
                                <button
                                    onClick={() => setExitConfirmationOpen(false)}
                                    className="flex-1 py-3 glass text-slate-400 rounded-2xl font-bold hover:bg-white/5 transition-colors"
                                >
                                    Остаться в приложении
                                </button>
                                <button
                                    onClick={() => {
                                        if (typeof AndroidInterface !== 'undefined' && AndroidInterface.exitApp) {
                                            AndroidInterface.exitApp();
                                        } else {
                                            navigator.app.exitApp();
                                        }
                                        setExitConfirmationOpen(false);
                                    }}
                                    className="flex-1 py-3 bg-gradient-to-r from-red-500 to-pink-500 text-white font-black rounded-2xl hover:from-red-600 hover:to-pink-600 transition-all"
                                >
                                    Да
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    // Сигнализируем, что приложение загружено
setTimeout(() => {
if (window.finishLoading) window.finishLoading();
}, 100);
    </script>
</body>
</html>
