version: '3.8'

services:
  gameroom-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gameroom-web
    restart: unless-stopped
    ports:
      # Host port : Container port (default 8080)
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - BACKLOG_DB_PATH=/app/data/backlog.db
      - TZ=UTC
      - GAME_ROOM_WEB_USERNAME=${GAME_ROOM_WEB_USERNAME:-}
      - GAME_ROOM_WEB_PASSWORD_HASH=${GAME_ROOM_WEB_PASSWORD_HASH:-}
      - GAMEROOM_SYNC_TOKEN=${GAMEROOM_SYNC_TOKEN:-}
    volumes:
      # Persistent storage on host for SQLite database and backups
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
